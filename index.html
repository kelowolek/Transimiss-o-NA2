<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmissão de Tela WebRTC</title>
    <!-- CSS / Estilização -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 900px;
            text-align: center;
        }
        h1 { margin-bottom: 20px; font-size: 24px; color: #38bdf8; }
        video {
            width: 100%;
            max-height: 500px;
            background-color: #000;
            border-radius: 12px;
            margin-top: 15px;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin: 10px 5px;
        }
        .btn:hover { background-color: #0369a1; }
        .btn:disabled { background-color: #64748b; cursor: not-allowed; }
        .share-container {
            margin-top: 20px;
            display: none;
            background: #334155;
            padding: 15px;
            border-radius: 8px;
        }
        input[type="text"] {
            width: 70%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
    <!-- Biblioteca PeerJS para WebRTC P2P Multi-conexão -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div class="card">
    <h1 id="title">Transmissão de Tela ao Vivo</h1>
    
    <!-- Área de Controle / Transmissão -->
    <div id="host-controls">
        <button id="start-btn" class="btn" onclick="startBroadcasting()">Transmitir Minha Tela</button>
    </div>

    <!-- Container do Link de Compartilhamento -->
    <div id="share-container" class="share-container">
        <p style="margin-bottom: 8px;">Copie e envie este link para as pessoas assistirem:</p>
        <input type="text" id="share-link" readonly>
        <button class="btn" onclick="copyLink()">Copiar Link</button>
    </div>

    <!-- Player de Vídeo -->
    <video id="video-player" autoplay playsinline controls muted></video>

    <div id="status" class="status">Aguardando ação...</div>
</div>

<script>
    let peer = null;
    let localStream = null;
    let connectedPeers = []; // Guarda a lista de pessoas assistindo

    const videoElement = document.getElementById('video-player');
    const statusElement = document.getElementById('status');
    const shareContainer = document.getElementById('share-container');
    const shareInput = document.getElementById('share-link');
    const hostControls = document.getElementById('host-controls');

    // Verifica se o usuário acessou via link de transmissão (se possui parâmetro ?stream=ID)
    const urlParams = new URLSearchParams(window.location.search);
    const streamIdParam = urlParams.get('stream');

    if (streamIdParam) {
        // MODO VISUALIZADOR
        hostControls.style.display = 'none';
        document.getElementById('title').innerText = "Assistindo à Transmissão";
        statusElement.innerText = "Conectando ao transmissor...";
        connectToStream(streamIdParam);
    }

    // Função para iniciar a transmissão de tela
    async function startBroadcasting() {
        try {
            // Captura a tela do computador do usuário
            localStream = await navigator.mediaDevices.getDisplayMedia({
                video: { frameRate: { ideal: 30, max: 60 } },
                audio: true
            });

            videoElement.srcObject = localStream;
            videoElement.muted = true; // Mutar localmente para evitar eco

            // Cria um nó PeerJS no servidor de sinalização público
            peer = new Peer();

            peer.on('open', (id) => {
                const streamUrl = `${window.location.origin}${window.location.pathname}?stream=${id}`;
                shareInput.value = streamUrl;
                shareContainer.style.display = 'block';
                document.getElementById('start-btn').disabled = true;
                statusElement.innerText = "Transmissão ativa! Compartilhe o link acima. Visualizadores conectados: 0";
            });

            // Gerencia novas conexões de espectadores (Múltiplos Espectadores)
            peer.on('connection', (conn) => {
                // Quando um visualizador conecta via sinalização
                const call = peer.call(conn.peer, localStream);
                connectedPeers.push(call);

                statusElement.innerText = `Transmissão ativa! Visualizadores conectados: ${connectedPeers.length}`;

                call.on('close', () => {
                    connectedPeers = connectedPeers.filter(p => p !== call);
                    statusElement.innerText = `Transmissão ativa! Visualizadores conectados: ${connectedPeers.length}`;
                });
            });

            // Tratamento caso o transmissor pare a transmissão pelo controle do navegador
            localStream.getVideoTracks()[0].onended = () => {
                statusElement.innerText = "Transmissão encerrada.";
                location.reload();
            };

        } catch (err) {
            console.error("Erro ao capturar tela:", err);
            statusElement.innerText = "Erro ao acessar a captura de tela ou permissão negada.";
        }
    }

    // Função para quem está assistindo conectar ao transmissor
    function connectToStream(hostId) {
        peer = new Peer();

        peer.on('open', (myId) => {
            // Conecta ao transmissor para sinalização
            const conn = peer.connect(hostId);

            // Aguarda a chamada com o fluxo de vídeo/áudio do transmissor
            peer.on('call', (call) => {
                call.answer(); // Aceita a chamada sem enviar vídeo
                call.on('stream', (remoteStream) => {
                    videoElement.srcObject = remoteStream;
                    videoElement.muted = false; // Desmuta áudio para quem assiste
                    statusElement.innerText = "Transmissão ao vivo conectada!";
                });
            });

            conn.on('error', (err) => {
                statusElement.innerText = "Erro na conexão ou transmissão encerrada.";
            });
        });
    }

    function copyLink() {
        shareInput.select();
        document.execCommand('copy');
        alert("Link copiado para a área de transferência!");
    }
</script>

</body>
</html>

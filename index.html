<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmissão de Tela com Áudio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 900px;
            text-align: center;
        }
        h1 { margin-bottom: 10px; font-size: 24px; color: #38bdf8; }
        .alert {
            background-color: #0284c722;
            border: 1px solid #0284c7;
            color: #38bdf8;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            max-height: 500px;
            background-color: #000;
            border-radius: 12px;
            margin-top: 15px;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin: 10px 5px;
        }
        .btn:hover { background-color: #0369a1; }
        .btn:disabled { background-color: #64748b; cursor: not-allowed; }
        .share-container {
            margin-top: 20px;
            display: none;
            background: #334155;
            padding: 15px;
            border-radius: 8px;
        }
        input[type="text"] {
            width: 70%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
    <!-- Biblioteca PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div class="card">
    <h1 id="title">Transmissão de Tela com Áudio</h1>
    
    <div id="alert-box" class="alert">
        ⚠️ <b>Atenção ao transmitir:</b> Quando o navegador abrir a janela de seleção, certifique-se de marcar a opção <b>"Compartilhar áudio do sistema"</b> na parte inferior da tela.
    </div>

    <!-- Área de Controle -->
    <div id="host-controls">
        <button id="start-btn" class="btn" onclick="startBroadcasting()">Transmitir Minha Tela</button>
    </div>

    <!-- Botão de Unmute para Espectadores -->
    <div id="viewer-controls" style="display: none;">
        <button id="unmute-btn" class="btn" style="background-color: #10b981;" onclick="enableAudio()">🔊 Ativar Áudio</button>
    </div>

    <!-- Container do Link de Compartilhamento -->
    <div id="share-container" class="share-container">
        <p style="margin-bottom: 8px;">Envie este link para as pessoas assistirem:</p>
        <input type="text" id="share-link" readonly>
        <button class="btn" onclick="copyLink()">Copiar Link</button>
    </div>

    <!-- Player de Vídeo -->
    <video id="video-player" autoplay playsinline controls></video>

    <div id="status" class="status">Aguardando ação...</div>
</div>

<script>
    let peer = null;
    let localStream = null;
    let connectedPeers = [];

    const videoElement = document.getElementById('video-player');
    const statusElement = document.getElementById('status');
    const shareContainer = document.getElementById('share-container');
    const shareInput = document.getElementById('share-link');
    const hostControls = document.getElementById('host-controls');
    const viewerControls = document.getElementById('viewer-controls');
    const alertBox = document.getElementById('alert-box');

    const urlParams = new URLSearchParams(window.location.search);
    const streamIdParam = urlParams.get('stream');

    if (streamIdParam) {
        // MODO ESPECTADOR
        hostControls.style.display = 'none';
        alertBox.style.display = 'none';
        viewerControls.style.display = 'block';
        document.getElementById('title').innerText = "Assistindo à Transmissão";
        statusElement.innerText = "Conectando ao transmissor...";
        connectToStream(streamIdParam);
    }

    async function startBroadcasting() {
        try {
            // Solicita Vídeo + Áudio do sistema
            localStream = await navigator.mediaDevices.getDisplayMedia({
                video: { frameRate: { ideal: 30, max: 60 } },
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    sampleRate: 44100
                }
            });

            // Exibe localmente mutado para o transmissor não ouvir o próprio eco
            videoElement.srcObject = localStream;
            videoElement.muted = true;

            peer = new Peer();

            peer.on('open', (id) => {
                const streamUrl = `${window.location.origin}${window.location.pathname}?stream=${id}`;
                shareInput.value = streamUrl;
                shareContainer.style.display = 'block';
                document.getElementById('start-btn').disabled = true;
                
                const hasAudio = localStream.getAudioTracks().length > 0;
                const audioStatus = hasAudio ? "Áudio capturado com sucesso!" : "AVISO: Nenhum áudio detectado (Marque 'Compartilhar áudio do sistema').";
                statusElement.innerText = `Transmissão ativa! ${audioStatus}`;
            });

            peer.on('connection', (conn) => {
                const call = peer.call(conn.peer, localStream);
                connectedPeers.push(call);

                statusElement.innerText = `Transmissão ativa! Espectadores conectados: ${connectedPeers.length}`;

                call.on('close', () => {
                    connectedPeers = connectedPeers.filter(p => p !== call);
                    statusElement.innerText = `Transmissão ativa! Espectadores conectados: ${connectedPeers.length}`;
                });
            });

            localStream.getVideoTracks()[0].onended = () => {
                statusElement.innerText = "Transmissão encerrada.";
                location.reload();
            };

        } catch (err) {
            console.error("Erro ao capturar tela/áudio:", err);
            statusElement.innerText = "Erro ao iniciar a captura ou permissão negada.";
        }
    }

    function connectToStream(hostId) {
        peer = new Peer();

        peer.on('open', () => {
            const conn = peer.connect(hostId);

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (remoteStream) => {
                    videoElement.srcObject = remoteStream;
                    
                    // Tenta desmutar automaticamente
                    videoElement.muted = false;
                    videoElement.play().catch(() => {
                        // Se o navegador bloquear o áudio automático, exige que clique no botão
                        statusElement.innerText = "Conectado! Clique no botão 'Ativar Áudio' acima para ouvir.";
                    });

                    statusElement.innerText = "Transmissão ao vivo conectada com áudio!";
                });
            });

            conn.on('error', () => {
                statusElement.innerText = "Erro na conexão ou transmissão encerrada.";
            });
        });
    }

    // Função para permitir som em celulares quando o autoplay de áudio é bloqueado
    function enableAudio() {
        videoElement.muted = false;
        videoElement.volume = 1.0;
        videoElement.play();
        document.getElementById('unmute-btn').style.display = 'none';
        statusElement.innerText = "Áudio ativado com sucesso!";
    }

    function copyLink() {
        shareInput.select();
        document.execCommand('copy');
        alert("Link copiado!");
    }
</script>

</body>
</html>

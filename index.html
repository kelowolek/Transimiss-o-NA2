<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmissão com Contador de Espectadores</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 900px;
            text-align: center;
            position: relative;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        h1 { font-size: 22px; color: #38bdf8; text-align: left; }
        
        /* Badge do Contador */
        .viewer-badge {
            background-color: #0284c7;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .instructions {
            background: #334155;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: left;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        video {
            width: 100%;
            max-height: 480px;
            background-color: #000;
            border-radius: 12px;
            margin-top: 10px;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px 4px;
        }
        .btn-green { background-color: #10b981; }
        .share-container {
            margin-top: 15px;
            display: none;
            background: #1e293b;
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 8px;
        }
        input[type="text"] {
            width: 65%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
        }
        .status { margin-top: 12px; font-size: 13px; color: #94a3b8; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div class="card">
    <div class="header-container">
        <h1 id="title">Transmissão de Tela</h1>
        
        <!-- Badge Visível por Padrão quando a transmissão Iniciar -->
        <div class="viewer-badge" id="viewer-badge" style="display: none;">
            <span class="live-dot"></span>
            <span id="viewer-count">0 pessoas assistindo</span>
        </div>
    </div>

    <div id="instructions-box" class="instructions">
        💡 <b>Dica essencial para áudio (Google Chrome):</b> Ao clicar em Transmitir, selecione <b>"Guia do Chrome"</b> e marque a opção <i>"Compartilhar áudio da guia"</i>.
    </div>

    <div id="host-controls">
        <button id="start-btn" class="btn" onclick="startBroadcasting()">🚀 Transmitir Minha Tela</button>
    </div>

    <div id="viewer-controls" style="display: none;">
        <button id="unmute-btn" class="btn btn-green" onclick="enableAudio()">🔊 Clique Aqui para Ativar Som</button>
    </div>

    <div id="share-container" class="share-container">
        <p style="margin-bottom: 6px; font-size: 14px;">Link para enviar aos espectadores:</p>
        <input type="text" id="share-link" readonly>
        <button class="btn" onclick="copyLink()">Copiar</button>
    </div>

    <video id="video-player" autoplay playsinline controls></video>

    <div id="status" class="status">Aguardando ação...</div>
</div>

<script>
    let peer = null;
    let combinedStream = null;
    let activeConnections = [];

    const videoElement = document.getElementById('video-player');
    const statusElement = document.getElementById('status');
    const shareContainer = document.getElementById('share-container');
    const shareInput = document.getElementById('share-link');
    const hostControls = document.getElementById('host-controls');
    const viewerControls = document.getElementById('viewer-controls');
    const instructionsBox = document.getElementById('instructions-box');
    const viewerBadge = document.getElementById('viewer-badge');
    const viewerCountElement = document.getElementById('viewer-count');

    const urlParams = new URLSearchParams(window.location.search);
    const streamIdParam = urlParams.get('stream');

    if (streamIdParam) {
        // MODO ESPECTADOR
        hostControls.style.display = 'none';
        instructionsBox.style.display = 'none';
        viewerControls.style.display = 'block';
        viewerBadge.style.display = 'inline-flex';
        document.getElementById('title').innerText = "Assistindo à Transmissão";
        statusElement.innerText = "Conectando ao transmissor...";
        connectToStream(streamIdParam);
    }

    async function startBroadcasting() {
        try {
            const displayStream = await navigator.mediaDevices.getDisplayMedia({
                video: { frameRate: { ideal: 30, max: 60 } },
                audio: true
            });

            combinedStream = new MediaStream();
            displayStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));

            if (displayStream.getAudioTracks().length > 0) {
                displayStream.getAudioTracks().forEach(track => combinedStream.addTrack(track));
                statusElement.innerText = "Áudio capturado com sucesso!";
            } else {
                try {
                    const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    micStream.getAudioTracks().forEach(track => combinedStream.addTrack(track));
                    statusElement.innerText = "Usando áudio do microfone/sistema!";
                } catch (micErr) {
                    statusElement.innerText = "AVISO: Transmitindo sem áudio.";
                }
            }

            videoElement.srcObject = combinedStream;
            videoElement.muted = true;

            peer = new Peer();

            peer.on('open', (id) => {
                const streamUrl = `${window.location.origin}${window.location.pathname}?stream=${id}`;
                shareInput.value = streamUrl;
                shareContainer.style.display = 'block';
                viewerBadge.style.display = 'inline-flex'; // Exibe o indicador imediatamente
                document.getElementById('start-btn').disabled = true;
                updateViewerCount();
            });

            peer.on('connection', (conn) => {
                // Aguarda a abertura da conexão de dados para incluir na lista
                conn.on('open', () => {
                    activeConnections.push(conn);
                    peer.call(conn.peer, combinedStream);
                    updateViewerCount();
                });

                const removeConn = () => {
                    activeConnections = activeConnections.filter(c => c !== conn);
                    updateViewerCount();
                };

                conn.on('close', removeConn);
                conn.on('error', removeConn);
            });

            displayStream.getVideoTracks()[0].onended = () => {
                location.reload();
            };

        } catch (err) {
            console.error(err);
            statusElement.innerText = "Erro ao iniciar captura de tela.";
        }
    }

    function updateViewerCount() {
        const count = activeConnections.length;
        const text = count === 1 ? "1 pessoa assistindo" : `${count} pessoas assistindo`;
        viewerCountElement.innerText = text;

        // Envia a contagem atualizada para todas as conexões ativas
        activeConnections.forEach(conn => {
            if (conn.open) {
                conn.send({ type: 'VIEWER_COUNT', count: count });
            }
        });
    }

    function connectToStream(hostId) {
        peer = new Peer();

        peer.on('open', () => {
            const conn = peer.connect(hostId);

            conn.on('open', () => {
                statusElement.innerText = "Conexão estabelecida com o transmissor...";
            });

            conn.on('data', (data) => {
                if (data && data.type === 'VIEWER_COUNT') {
                    const count = data.count;
                    const text = count === 1 ? "1 pessoa assistindo" : `${count} pessoas assistindo`;
                    viewerCountElement.innerText = text;
                }
            });

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (remoteStream) => {
                    videoElement.srcObject = remoteStream;
                    videoElement.muted = false;
                    
                    videoElement.play().catch(() => {
                        statusElement.innerText = "Conectado! Clique no botão verde '🔊 Clique Aqui para Ativar Som'.";
                    });

                    statusElement.innerText = "Transmissão ao vivo conectada!";
                });
            });
        });
    }

    function enableAudio() {
        videoElement.muted = false;
        videoElement.volume = 1.0;
        videoElement.play();
        document.getElementById('unmute-btn').style.display = 'none';
        statusElement.innerText = "Áudio ativado com sucesso!";
    }

    function copyLink() {
        shareInput.select();
        document.execCommand('copy');
        alert("Link copiado!");
    }
</script>

</body>
</html>
